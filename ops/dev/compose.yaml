name: codeline-dev

services:
  postgres:
    image: postgres:18-alpine
    command:
      - postgres
      - -c
      - wal_level=logical
      - -c
      - max_replication_slots=10
      - -c
      - max_wal_senders=10
      - -c
      - search_path=public
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - codeline
    ports:
      # Host port 6002 maps to Postgres's fixed container port 5432.
      - "127.0.0.1:${POSTGRES_PORT:?POSTGRES_PORT is required}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql

  zero-cache:
    build:
      context: ${ZERO_CHECKOUT:-/home/david/opensource/zero}
      dockerfile: /home/david/adaptive/codeline/ops/dev/zero/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: development
      ZERO_ADMIN_PASSWORD: ${ZERO_ADMIN_PASSWORD:?ZERO_ADMIN_PASSWORD is required}
      ZERO_APP_ID: ${ZERO_APP_ID:?ZERO_APP_ID is required}
      ZERO_CHANGE_DB: ${ZERO_CHANGE_DB:?ZERO_CHANGE_DB is required}
      ZERO_CVR_DB: ${ZERO_CVR_DB:?ZERO_CVR_DB is required}
      ZERO_LOG_FORMAT: json
      ZERO_NUM_SYNC_WORKERS: 1
      ZERO_PORT: 4848
      ZERO_MUTATE_URL: ${ZERO_MUTATE_URL:?ZERO_MUTATE_URL is required}
      ZERO_MUTATE_FORWARD_COOKIES: ${ZERO_MUTATE_FORWARD_COOKIES:-true}
      ZERO_REPLICA_FILE: ${ZERO_REPLICA_FILE:?ZERO_REPLICA_FILE is required}
      ZERO_QUERY_URL: ${ZERO_QUERY_URL:?ZERO_QUERY_URL is required}
      ZERO_QUERY_FORWARD_COOKIES: ${ZERO_QUERY_FORWARD_COOKIES:-true}
      ZERO_AUTH_REVALIDATE_INTERVAL_SECONDS: ${ZERO_AUTH_REVALIDATE_INTERVAL_SECONDS:-300}
      ZERO_UPSTREAM_DB: ${ZERO_UPSTREAM_DB:?ZERO_UPSTREAM_DB is required}
      ZERO_UPSTREAM_MAX_CONNS: 6
      ZERO_CVR_MAX_CONNS: 6
    extra_hosts:
      - "host.containers.internal:host-gateway"
      - "preview.codeline.work:host-gateway"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:4848/"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 10s
    networks:
      - codeline
    ports:
      # Host port 6003 maps to Zero Cache's fixed container port 4848.
      - "127.0.0.1:${ZERO_PORT:?ZERO_PORT is required}:4848"
    volumes:
      - zero-data:/var/lib/zero

networks:
  codeline:
    name: codeline-dev

volumes:
  postgres-data:
    name: codeline-dev-postgres
  zero-data:
    name: codeline-dev-zero
