provider: multisub
providerName: multisub - multisub.contentoren.de
model: gpt-6.1-sol
name: GPT 6.1 Sol (multisub)
family: gpt-6.1
status: active
enabled: true
baseUrl: https://multisub.contentoren.de/v1
apiKey: $MULTISUB_API_KEY
env: [$MULTISUB_API_KEY]
transport: openai/responses
providerOptions:
  npm: '@ai-sdk/openai'
  reasoningEffort: medium
  reasoningSummary: auto
  textVerbosity: low
  include: [reasoning.encrypted_content]
  store: false
options: {}
limit:
  context: 272000
  output: 128000
modalities:
  input: [text, image]
  output: [text]
cost:
  - input: 5
    output: 30
    cacheRead: 0.5
    cacheWrite: 6.25
  - tier:
      type: context
      size: 200000
    input: 10
    output: 45
    cacheRead: 1
    cacheWrite: 12.5
variants:
  - id: low
    effort: low
    reasoningEffort: low
    reasoningSummary: auto
    textVerbosity: low
  - id: medium
    effort: medium
    reasoningEffort: medium
    reasoningSummary: auto
    textVerbosity: low
  - id: high
    effort: high
    reasoningEffort: high
    reasoningSummary: detailed
    textVerbosity: low
  - id: xhigh
    effort: xhigh
    reasoningEffort: xhigh
    reasoningSummary: detailed
    textVerbosity: low
  - id: max
    effort: max
    reasoningEffort: max
    reasoningSummary: detailed
    textVerbosity: low
