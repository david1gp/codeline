provider: codex-lb
providerName: codex-lb - codex.contentoren.de
model: gpt-5.6-luna
name: GPT 5.6 Luna (codex-lb)
family: gpt-5.6
status: active
enabled: true
baseUrl: https://codex.contentoren.de/v1
apiKey: $CODEX_LB_API_TOKEN
env: [$CODEX_LB_API_TOKEN]
transport: openai/responses
providerOptions:
  npm: '@ai-sdk/openai'
  reasoningEffort: medium
  reasoningSummary: auto
  textVerbosity: low
  include: [reasoning.encrypted_content]
  store: false
options: {}
limit:
  context: 272000
  output: 128000
modalities:
  input: [text, image]
  output: [text]
cost:
  - input: 0.2
    output: 1.2
    cacheRead: 0.02
    cacheWrite: 1.25
  - tier:
      type: context
      size: 200000
    input: 2
    output: 9
    cacheRead: 0.2
    cacheWrite: 2.5
variants:
  - id: low
    effort: low
    reasoningEffort: low
    reasoningSummary: auto
    textVerbosity: low
  - id: medium
    effort: medium
    reasoningEffort: medium
    reasoningSummary: auto
    textVerbosity: low
  - id: high
    effort: high
    reasoningEffort: high
    reasoningSummary: detailed
    textVerbosity: low
  - id: xhigh
    effort: xhigh
    reasoningEffort: xhigh
    reasoningSummary: detailed
    textVerbosity: low
  - id: max
    effort: max
    reasoningEffort: max
    reasoningSummary: detailed
    textVerbosity: low
