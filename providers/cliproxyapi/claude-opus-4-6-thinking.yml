provider: cliproxyapi
providerName: CLIProxyAPI - subs.contentoren.de
model: claude-opus-4-6-thinking
name: Opus 4.6 - Antigravity (cliproxy)
family: claude-opus-4.6
status: active
enabled: true
baseUrl: https://subs.contentoren.de/v1
apiKey: $SUBS_CONTENTOREN_DE_API_KEY
env: [$SUBS_CONTENTOREN_DE_API_KEY]
transport: openai/completions
providerOptions:
  npm: '@ai-sdk/openai-compatible'
  blacklist: [gpt-5.6-sol, gpt-5.6-terra, gpt-5.6-luna]
options:
  provider:
    npm: '@ai-sdk/anthropic'
limit:
  context: 200000
  output: 64000
modalities:
  input: [text, image]
  output: [text]
reasoning: true
cost:
  input: 5
  output: 25
  cacheRead: 0.5
  cacheWrite: 6.25
